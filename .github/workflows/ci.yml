name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # YOZORA (fork): the embedded web UI is committed under web/, so CI no
      # longer needs an npm toolchain to produce a server artifact. Rebuild
      # web/ locally (seanime-web: npm ci && npx rsbuild build, then cp -r
      # seanime-web/out/* web/) when the web UI changes.
      - name: Verify embedded web UI is present
        run: test -f web/index.html

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build server binary
        run: go build -o seanime-server -trimpath -ldflags="-s -w" .

      - uses: actions/upload-artifact@v4
        with:
          name: seanime-server
          path: seanime-server
          retention-days: 7
