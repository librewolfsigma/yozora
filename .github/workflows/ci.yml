name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build web UI
        working-directory: seanime-web
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npx rsbuild build

      - name: Embed web UI
        run: |
          rm -rf web
          cp -r seanime-web/out web

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build server binary
        run: go build -o seanime-server -trimpath -ldflags="-s -w" .

      - uses: actions/upload-artifact@v4
        with:
          name: seanime-server
          path: seanime-server
          retention-days: 7
